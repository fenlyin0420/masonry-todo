name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: 构建并发布 APK
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: 依赖
        run: flutter pub get

      - name: 静态检查
        run: flutter analyze

      - name: 测试
        run: flutter test

      - name: 写入签名配置
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS_VALUE: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD_VALUE: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$STORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS_VALUE"
              echo "keyPassword=$KEY_PASSWORD_VALUE"
            } > android/key.properties
            echo "使用正式签名"
          else
            echo "未配置签名 secret，退回 debug 签名"
          fi

      - name: 构建 APK（按架构拆分）
        # 只出手机实际需要的两个 ABI，不出模拟器专用的 x86_64。
        run: |
          flutter build apk --release --split-per-abi \
            --target-platform android-arm \
            --target-platform android-arm64

      - name: 整理产物
        run: |
          cd build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"
            abi="${abi%-release.apk}"
            cp "$f" "masonry-todo-$abi.apk"
          done

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: masonry-todo-apk
          path: build/app/outputs/flutter-apk/masonry-todo-*.apk
          if-no-files-found: error

      - name: 准备发布说明
        id: notes
        run: |
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-notes.md
            echo "用 RELEASE_NOTES.md"
          else
            VERSION="${GITHUB_REF_NAME#v}"
            {
              echo "拾记 **${VERSION}**"
              echo ""
              echo "**Assets**"
              echo ""
              for apk in build/app/outputs/flutter-apk/masonry-todo-*.apk; do
                [ -e "$apk" ] || continue
                echo "- \`$(basename "$apk")\` — 按设备架构拆分，选与手机匹配的那个"
              done
            } > release-notes.md
            echo "未提供 RELEASE_NOTES.md，用自动生成的说明"
          fi

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          DIR="build/app/outputs/flutter-apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$DIR"/masonry-todo-*.apk --clobber
          else
            gh release create "$TAG" \
              --title "拾记 ${TAG#v}" \
              --notes-file release-notes.md \
              "$DIR"/masonry-todo-*.apk
          fi
